<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#E8F5EE"/>
  <circle cx="690" cy="80" r="42" fill="#FFC94D"/>

  <!-- ciudad de fondo, fuera del conjunto -->
  <g fill="#BFD9CB">
    <rect x="20" y="150" width="60" height="120" rx="4"/>
    <rect x="700" y="140" width="70" height="130" rx="4"/>
    <rect x="620" y="180" width="50" height="90" rx="4"/>
  </g>

  <!-- TORRES DEL CONJUNTO en U alrededor del patio -->
  <!-- torre izquierda -->
  <rect x="70" y="180" width="150" height="300" rx="8" fill="#0F2E24"/>
  <!-- torre fondo izq -->
  <rect x="240" y="140" width="140" height="230" rx="8" fill="#14392E"/>
  <!-- torre fondo der -->
  <rect x="400" y="150" width="140" height="220" rx="8" fill="#14392E"/>
  <!-- torre derecha -->
  <rect x="560" y="190" width="150" height="290" rx="8" fill="#0F2E24"/>

  <!-- balcones (bandas horizontales, lenguaje residencial) -->
  <g fill="#1E4A3B">
    <rect x="70" y="250" width="150" height="9"/><rect x="70" y="320" width="150" height="9"/><rect x="70" y="390" width="150" height="9"/>
    <rect x="560" y="258" width="150" height="9"/><rect x="560" y="328" width="150" height="9"/><rect x="560" y="398" width="150" height="9"/>
  </g>

  <!-- ventanas iluminadas -->
  <g fill="#FFC94D">
    <rect x="92" y="206" width="26" height="30" rx="4"/><rect x="132" y="206" width="26" height="30" rx="4"/><rect x="172" y="206" width="26" height="30" rx="4"/>
    <rect x="92" y="276" width="26" height="30" rx="4"/><rect x="172" y="276" width="26" height="30" rx="4"/>
    <rect x="132" y="346" width="26" height="30" rx="4"/><rect x="172" y="346" width="26" height="30" rx="4"/>
    <rect x="262" y="170" width="26" height="30" rx="4"/><rect x="302" y="170" width="26" height="30" rx="4"/><rect x="342" y="170" width="26" height="30" rx="4"/>
    <rect x="262" y="234" width="26" height="30" rx="4"/><rect x="342" y="234" width="26" height="30" rx="4"/>
    <rect x="302" y="298" width="26" height="30" rx="4"/>
    <rect x="422" y="180" width="26" height="30" rx="4"/><rect x="462" y="180" width="26" height="30" rx="4"/><rect x="502" y="180" width="26" height="30" rx="4"/>
    <rect x="422" y="244" width="26" height="30" rx="4"/><rect x="502" y="244" width="26" height="30" rx="4"/>
    <rect x="462" y="308" width="26" height="30" rx="4"/>
    <rect x="582" y="216" width="26" height="30" rx="4"/><rect x="622" y="216" width="26" height="30" rx="4"/><rect x="662" y="216" width="26" height="30" rx="4"/>
    <rect x="582" y="286" width="26" height="30" rx="4"/><rect x="662" y="286" width="26" height="30" rx="4"/>
    <rect x="622" y="356" width="26" height="30" rx="4"/>
  </g>

  <!-- PATIO INTERIOR (zona común entre torres) -->
  <path d="M220 480 L220 400 L560 400 L560 480 Z" fill="#7FD1AE"/>
  <rect x="220" y="400" width="340" height="14" fill="#5BBF95"/>
  <!-- pasto del patio -->
  <rect y="480" width="800" height="120" fill="#7FD1AE"/>
  <path d="M0 505 Q200 492 400 504 T800 496 L800 600 L0 600 Z" fill="#5BBF95"/>

  <!-- sendero peatonal interno -->
  <ellipse cx="400" cy="540" rx="150" ry="40" fill="#EFE3D0"/>

  <!-- JUEGOS INFANTILES dentro del patio -->
  <!-- resbaladilla -->
  <g>
    <rect x="252" y="452" width="8" height="48" fill="#C0703F"/>
    <rect x="300" y="452" width="8" height="48" fill="#C0703F"/>
    <rect x="244" y="444" width="72" height="10" rx="4" fill="#FF6B4A"/>
    <path d="M316 452 L352 498 L336 500 L302 458 Z" fill="#FFC94D"/>
  </g>
  <!-- columpio -->
  <g stroke="#FF6B4A" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M420 500 L432 452"/><path d="M508 500 L496 452"/><path d="M432 452 L496 452"/>
    <path d="M450 452 L450 480"/><path d="M478 452 L478 480"/>
  </g>
  <rect x="442" y="480" width="44" height="8" rx="4" fill="#FF6B4A"/>

  <!-- arbolitos del conjunto -->
  <g>
    <rect x="196" y="462" width="9" height="42" fill="#8A5A3B"/><circle cx="200" cy="450" r="26" fill="#3E9B72"/>
    <rect x="586" y="462" width="9" height="42" fill="#8A5A3B"/><circle cx="590" cy="450" r="26" fill="#3E9B72"/>
    <rect x="376" y="418" width="8" height="26" fill="#8A5A3B"/><circle cx="380" cy="410" r="20" fill="#4EAE83"/>
  </g>

  <!-- NIÑOS jugando en el patio -->
  <g>
    <circle cx="336" cy="512" r="19" fill="#FFC94D"/><rect x="325" y="530" width="23" height="40" rx="11" fill="#FF6B4A"/>
    <circle cx="392" cy="524" r="16" fill="#FFC94D"/><rect x="383" y="539" width="19" height="33" rx="9" fill="#0F2E24"/>
  </g>
  <!-- adulto acompañando -->
  <g>
    <circle cx="470" cy="504" r="18" fill="#FFC94D"/><rect x="459" y="521" width="23" height="52" rx="11" fill="#3E9B72"/>
  </g>
  <circle cx="424" cy="562" r="13" fill="#fff" stroke="#0F2E24" stroke-width="4"/>

  <!-- CERRAMIENTO + PORTERÍA (lo que hace que sea conjunto) -->
  <g stroke="#0F2E24" stroke-width="6" stroke-linecap="round">
    <path d="M0 470 L60 470"/>
    <path d="M8 470 L8 500"/><path d="M30 470 L30 500"/><path d="M52 470 L52 500"/>
    <path d="M740 470 L800 470"/>
    <path d="M748 470 L748 500"/><path d="M770 470 L770 500"/><path d="M792 470 L792 500"/>
  </g>
  <!-- caseta de portería -->
  <rect x="718" y="424" width="60" height="52" rx="5" fill="#C0703F"/>
  <path d="M712 424 L748 400 L784 424 Z" fill="#0F2E24"/>
  <rect x="734" y="440" width="28" height="22" rx="3" fill="#FFC94D"/>
</svg>
